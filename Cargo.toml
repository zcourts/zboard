[package]
name = "aiboard"
version = "0.1.0"
edition = "2024"
description = "Filesystem-native message board for coordinating AI agent conversations"
license = "MIT"
repository = "https://github.com/zcourts/aiboard"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = { version = "1.2", features = ["serde"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3.23"
