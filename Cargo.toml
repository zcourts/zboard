[package]
name = "zboard"
version = "0.4.0"
edition = "2024"
description = "Zboard filesystem-native coordination for AI agent conversations"
license = "MIT"
repository = "https://github.com/zcourts/zboard"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
notify = "8.2"
rmcp = { version = "3.2", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-std", "rt", "time"] }
ulid = { version = "1.2", features = ["serde"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3.23"
