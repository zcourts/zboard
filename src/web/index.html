<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team chat</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --panel-2: #f0eee9; --line: #e2dfd8;
  --text: #1d1c1a; --muted: #6b6860; --accent: #2f6fdf; --accent-text: #ffffff;
  --mine: #e7efff; --warn: #b7791f; --warn-bg: #fff6e5; --ok: #2f9e5b; --danger: #c2413b;
  --mention: #fff1b8; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --panel: #1c1c1d; --panel-2: #242426; --line: #313134;
    --text: #ecebe8; --muted: #9a978f; --accent: #6d9cff; --accent-text: #0e1320;
    --mine: #1d2a44; --warn: #f0b75a; --warn-bg: #2d2416; --ok: #55c27f; --danger: #ef6a63;
    --mention: #4a3f12; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --panel: #1c1c1d; --panel-2: #242426; --line: #313134;
  --text: #ecebe8; --muted: #9a978f; --accent: #6d9cff; --accent-text: #0e1320;
  --mine: #1d2a44; --warn: #f0b75a; --warn-bg: #2d2416; --ok: #55c27f; --danger: #ef6a63;
  --mention: #4a3f12; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: grid; grid-template-columns: 270px minmax(0,1fr) 320px; grid-template-rows: auto minmax(0,1fr) auto; height: 100vh; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header.top h1 { font-size: 15px; margin: 0; font-weight: 650; }
header.top .sub { color: var(--muted); font-size: 12px; }
header.top .spacer { flex: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 9px; }
.icon-btn:hover { background: var(--panel-2); }
aside, main { min-height: 0; display: flex; flex-direction: column; }
aside.people { border-right: 1px solid var(--line); background: var(--panel); }
aside.side { border-left: 1px solid var(--line); background: var(--panel); }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 14px 6px; display: flex; justify-content: space-between; align-items: center; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; }
.person { display: flex; gap: 10px; padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; }
.person:hover { background: var(--panel-2); }
.person.active { background: var(--panel-2); border-left-color: var(--accent); }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 650; font-size: 12px; color: #fff; position: relative; }
.avatar .dot { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--panel); background: #9a978f; }
.dot.online { background: var(--ok); }
.dot.working { background: var(--warn); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.person .meta { min-width: 0; flex: 1; }
.person .row1 { display: flex; justify-content: space-between; gap: 6px; }
.person .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person .when, .muted { color: var(--muted); font-size: 12px; }
.person .state { font-size: 12px; color: var(--muted); }
.person .state.working { color: var(--warn); }
.person .state.failed { color: var(--danger); }
.person .last { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.badge.human { color: var(--accent); }
main { background: var(--bg); }
.views { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.views input[type=search] { margin-left: auto; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; min-width: 160px; }
.filter-note { padding: 6px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); display: none; }
.filter-note.show { display: block; }
.messages { padding: 12px 16px 20px; }
.msg { display: flex; gap: 10px; padding: 6px 8px; border-radius: 10px; }
.msg:hover { background: var(--panel-2); }
.msg.mine .body-wrap { }
.msg .content { min-width: 0; flex: 1; }
.msg .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msg .who { font-weight: 650; }
.msg .route { font-size: 12px; color: var(--muted); }
.msg .text { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
.msg .text .mention { background: var(--mention); border-radius: 4px; padding: 0 2px; }
.msg .tags { margin-top: 3px; display: flex; gap: 4px; flex-wrap: wrap; }
.msg .actions { margin-top: 4px; display: flex; gap: 10px; font-size: 12px; }
.link { background: none; border: none; padding: 0; color: var(--accent); }
.link:hover { text-decoration: underline; }
.day { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0 6px; }
.unread-line { border-top: 1px solid var(--danger); margin: 8px 0; position: relative; }
.unread-line span { position: absolute; right: 0; top: -9px; background: var(--bg); color: var(--danger); font-size: 11px; padding: 0 6px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); margin: 8px 12px; box-shadow: var(--shadow); }
.card.warn { border-color: var(--warn); background: var(--warn-bg); }
.card .q { font-weight: 600; margin-bottom: 6px; }
.card .q:empty { display: none; }
.card .text { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.options { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.composer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; position: relative; }
.composer .to { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.composer select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 6px; }
.composer .box { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 40px; max-height: 180px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--bg); }
.composer textarea:focus, .views input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.suggest { position: absolute; bottom: 100%; left: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 220px; max-height: 220px; overflow-y: auto; display: none; z-index: 5; }
.suggest.show { display: block; }
.suggest div { padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.suggest div.sel, .suggest div:hover { background: var(--panel-2); }
.side-tabs { display: flex; border-bottom: 1px solid var(--line); }
.side-tabs button { flex: 1; border: none; background: none; padding: 10px 4px; border-bottom: 2px solid transparent; color: var(--muted); }
.side-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.count { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 99px; background: var(--danger); color: #fff; font-size: 11px; margin-left: 4px; }
.count:empty { display: none; }
.empty { color: var(--muted); padding: 20px 16px; text-align: center; font-size: 13px; }
.job { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.job .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
.pill.todo { color: var(--muted); } .pill.active { color: var(--warn); border-color: var(--warn); } .pill.done { color: var(--ok); border-color: var(--ok); }
.rule { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: pre-wrap; }
.add-rule { display: flex; gap: 6px; padding: 10px 12px; }
.add-rule input { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px; }
footer.notice { grid-column: 1 / -1; font-size: 11px; color: var(--muted); padding: 5px 16px; border-top: 1px solid var(--line); background: var(--panel); }
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; z-index: 10; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--bg); border-left: 1px solid var(--line); display: none; flex-direction: column; z-index: 11; }
.drawer.show, .drawer-bg.show { display: flex; }
.drawer header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); gap: 8px; }
.drawer header h2 { font-size: 15px; margin: 0; flex: 1; }
.mobile-nav { display: none; }
.toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; z-index: 20; }
.toast.show { display: block; }
@media (max-width: 1100px) { .app { grid-template-columns: 240px minmax(0,1fr) 280px; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0,1fr) auto auto; }
  .mobile-nav { display: flex; grid-column: 1; border-bottom: 1px solid var(--line); background: var(--panel); }
  .mobile-nav button { flex: 1; border: none; background: none; padding: 10px 4px; color: var(--muted); border-bottom: 2px solid transparent; }
  .mobile-nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  aside.people, aside.side, main { display: none; grid-column: 1; border: none; }
  .app[data-pane="people"] aside.people, .app[data-pane="side"] aside.side, .app[data-pane="chat"] main { display: flex; }
  header.top .sub { display: none; }
  .views input[type=search] { min-width: 0; flex: 1; margin-left: 0; }
}
</style>
</head>
<body>
<div class="app" id="app" data-pane="chat">
  <header class="top">
    <h1 id="title">Team chat</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="notifyBtn" title="Desktop notifications for Needs you">🔔</button>
    <button class="icon-btn" id="themeBtn" title="Light or dark">◐</button>
  </header>
  <nav class="mobile-nav" id="mobileNav">
    <button data-pane="chat" class="active">Chat</button>
    <button data-pane="people">People</button>
    <button data-pane="side">Needs you <span class="count" id="needsCountMobile"></span></button>
  </nav>
  <aside class="people">
    <div class="section-title"><span>People</span><span id="onlineCount"></span></div>
    <div class="scroll" id="people"></div>
  </aside>
  <main>
    <div class="views" id="views">
      <button class="chip active" data-view="team">Team room</button>
      <button class="chip" data-view="direct">Direct messages</button>
      <button class="chip" data-view="all">Everything</button>
      <input type="search" id="search" placeholder="Search messages">
    </div>
    <div class="filter-note" id="filterNote"></div>
    <div class="scroll" id="scroller"><div class="messages" id="messages"></div></div>
    <div class="composer" id="composer">
      <div class="suggest" id="suggest"></div>
      <div class="to" id="composerTo"></div>
      <div class="box">
        <textarea id="input" rows="1" placeholder="Message the team · @name wakes an agent · #tag"></textarea>
        <button class="btn primary" id="sendBtn">Send</button>
      </div>
    </div>
  </main>
  <aside class="side">
    <div class="side-tabs" id="sideTabs">
      <button data-tab="needs" class="active">Needs you <span class="count" id="needsCount"></span></button>
      <button data-tab="jobs">Jobs</button>
      <button data-tab="rules">Rules</button>
    </div>
    <div class="scroll" id="sidePanel"></div>
  </aside>
  <footer class="notice">A board message never gives an agent more authority than you already gave it. Agents treat these messages as notes from the team, not new permissions.</footer>
</div>
<div class="drawer-bg" id="drawerBg"></div>
<div class="drawer" id="drawer">
  <header><h2>Thread</h2><button class="icon-btn" id="closeDrawer">Close</button></header>
  <div class="scroll"><div class="messages" id="threadMessages"></div></div>
  <div class="composer">
    <div class="box">
      <textarea id="threadInput" rows="1" placeholder="Reply in this thread"></textarea>
      <button class="btn primary" id="threadSend">Reply</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = {
  me: null, team: "team", hopLimit: 6, cursor: 0, messages: new Map(), agents: [], dismissed: new Set(),
  view: localStorageGet("view") || "team", person: null, search: "", side: "needs", thread: null,
  dmTo: "", knownNeeds: null, lastRead: JSON.parse(localStorageGet("lastRead") || "{}"),
};
function localStorageGet(k) { try { return localStorage.getItem("zboard." + k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem("zboard." + k, v); } catch (e) {} }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function initials(name) {
  const parts = name.split(/[-_ ]+/).filter(Boolean);
  if (parts.length > 1) return (parts[0][0] + parts[1][0]).toUpperCase();
  return (parts[0] || "?").slice(0, 2).toUpperCase();
}
function agent(id) { return S.agents.find(a => a.id === id); }
function nameOf(id) { const a = agent(id); return a ? a.name : id; }
// The board omits empty lists, so fill them in once on arrival.
function norm(m) { m.to = m.to || []; m.tags = m.tags || []; return m; }
function isHuman(m) { return m.meta && m.meta.human === true; }
function hops(m) { return (m.meta && m.meta.zboard_hops) || 0; }
function rel(ts) {
  if (!ts) return "";
  const d = (Date.now() - new Date(ts).getTime()) / 1000;
  if (d < 45) return "now"; if (d < 3600) return Math.round(d / 60) + "m"; if (d < 86400) return Math.round(d / 3600) + "h";
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function clock(ts) { return new Date(ts).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }
function avatar(id, extraClass) {
  const a = agent(id); const name = a ? a.name : id;
  const dot = a ? `<span class="dot ${a.running || (a.activity && a.activity.state === "working") ? "working" : a.online ? "online" : ""}"></span>` : "";
  return `<div class="avatar ${extraClass||""}" style="background:hsl(${hue(id)} 45% ${a && a.human ? 38 : 48}%)">${esc(initials(name))}${dot}</div>`;
}
function routeLabel(m) {
  if (m.group === S.team) return "";
  if (m.group) return "in " + m.group;
  return "→ " + m.to.map(nameOf).join(", ");
}
function renderText(text) {
  let html = esc(text);
  html = html.replace(/(^|[^\w])@([A-Za-z0-9][\w-]*)/g, (all, pre, name) => `${pre}<span class="mention">@${name}</span>`);
  return html;
}

async function api(path, body) {
  const options = body ? { method: "POST", headers: { "Content-Type": "application/json", "X-Zboard": "1" }, body: JSON.stringify(body) } : {};
  const res = await fetch(path, options);
  const json = await res.json().catch(() => ({ ok: false, error: "bad response" }));
  if (!json.ok) throw new Error(json.error || ("HTTP " + res.status));
  return json.data;
}
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3500); }

async function poll() {
  try {
    const data = await api("/api/state?cursor=" + S.cursor);
    S.me = data.me; S.team = data.team; S.hopLimit = data.hop_limit; S.agents = data.agents;
    S.dismissed = new Set(data.dismissed);
    if (data.reset) S.messages.clear();
    let fresh = 0;
    for (const m of data.messages) { if (!S.messages.has(m.id)) fresh++; S.messages.set(m.id, norm(m)); }
    S.cursor = data.cursor;
    $("title").textContent = "Team chat";
    $("subtitle").textContent = `${data.me.project} · you are ${data.me.name}`;
    document.title = `${needs().length ? "(" + needs().length + ") " : ""}Team chat · ${data.me.project}`;
    renderPeople(); renderSide(); renderComposer();
    if (fresh || data.reset) renderMessages(data.reset);
    if (S.thread) refreshThread();
    notifyNeeds();
  } catch (e) {
    $("subtitle").textContent = "Reconnecting… " + e.message;
  }
  setTimeout(poll, 2000);
}

function sortedMessages() { return [...S.messages.values()].sort((a, b) => a.id < b.id ? -1 : 1); }
function inView(m) {
  if (S.person && m.from !== S.person && !m.to.includes(S.person)) return false;
  if (S.search && !m.message.toLowerCase().includes(S.search)) return false;
  if (S.person || S.search) return true;
  if (S.view === "team") return m.group === S.team;
  if (S.view === "direct") return !m.group;
  return true;
}
function replyCount(m) { let n = 0; for (const x of S.messages.values()) if (x.thread === m.id && x.id !== m.id) n++; return n; }
function latestInThread(thread) { let last = null; for (const x of S.messages.values()) if (x.thread === thread && (!last || x.id > last.id)) last = x; return last; }
function answered(m) { for (const x of S.messages.values()) if (x.thread === m.thread && x.id > m.id && x.from === S.me.id) return true; return false; }
function decisionAnswer(m) { for (const x of S.messages.values()) if (x.reply_to === m.id && x.meta && x.meta.decision_answer) return x.meta.decision_answer; return null; }

function messageHtml(m, inThread) {
  const mine = S.me && m.from === S.me.id;
  const tags = m.tags && m.tags.length ? `<div class="tags">${m.tags.map(t => `<span class="badge">#${esc(t)}</span>`).join("")}</div>` : "";
  let extra = "";
  const decision = m.meta && m.meta.decision;
  if (decision && Array.isArray(decision.options)) {
    const ans = decisionAnswer(m);
    extra += ans ? `<div class="muted">Answered: <b>${esc(ans)}</b></div>`
      : `<div class="options">${decision.options.map(o => `<button class="btn" data-answer="${esc(m.id)}" data-option="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }
  if (m.meta && m.meta.job) extra += `<div><span class="pill ${esc(m.meta.job.status)}">job · ${esc(m.meta.job.status)}</span></div>`;
  const last = latestInThread(m.thread);
  if (!inThread && last && last.id === m.id && !isHuman(m) && hops(m) >= S.hopLimit) {
    extra += `<div class="card warn"><div class="q">Agents paused after ${hops(m)} replies to each other.</div>
      <div class="muted">They won't wake each other again in this thread until you say so.</div>
      <div class="options"><button class="btn primary" data-continue="${esc(m.id)}">Let them continue</button><button class="btn" data-thread="${esc(m.id)}">Read the thread</button></div></div>`;
  }
  const replies = inThread ? 0 : replyCount(m);
  const actions = inThread ? "" : `<div class="actions">
      <button class="link" data-thread="${esc(m.id)}">${replies ? replies + (replies === 1 ? " reply" : " replies") : "Reply in thread"}</button>
      ${m.meta && m.meta.job ? "" : `<button class="link" data-makejob="${esc(m.id)}">Make job</button>`}</div>`;
  return `<div class="msg ${mine ? "mine" : ""}" id="m-${esc(m.id)}">${avatar(m.from)}<div class="content">
    <div class="head"><span class="who">${esc(nameOf(m.from))}</span>${isHuman(m) ? '<span class="badge human">person</span>' : ""}
    <span class="route">${esc(routeLabel(m))}</span><span class="muted" title="${esc(m.timestamp)}">${clock(m.timestamp)}</span>
    ${m.reply_to && !inThread ? '<span class="muted">in a thread</span>' : ""}</div>
    <div class="text">${renderText(m.message)}</div>${tags}${extra}${actions}</div></div>`;
}

function renderMessages(scrollToEnd) {
  const box = $("messages"); const scroller = $("scroller");
  const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
  const list = sortedMessages().filter(inView).filter(m => S.view !== "team" || S.person || S.search || !m.reply_to || m.group === S.team);
  const key = S.person ? "p:" + S.person : S.view;
  const lastRead = S.lastRead[key] || "";
  let html = ""; let day = ""; let unreadShown = false;
  for (const m of list.slice(-600)) {
    const d = new Date(m.timestamp).toDateString();
    if (d !== day) { day = d; html += `<div class="day">${esc(new Date(m.timestamp).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }))}</div>`; }
    if (lastRead && !unreadShown && m.id > lastRead && m.from !== (S.me && S.me.id)) { unreadShown = true; html += `<div class="unread-line"><span>New</span></div>`; }
    html += messageHtml(m, false);
  }
  if (!list.length) html = `<div class="empty">${S.view === "direct" ? "No direct messages yet." : "No messages here yet. Say hello to the team."}</div>`;
  box.innerHTML = html;
  if (scrollToEnd || atBottom) scroller.scrollTop = scroller.scrollHeight;
  if (list.length && document.hasFocus()) { S.lastRead[key] = list[list.length - 1].id; localStorageSet("lastRead", JSON.stringify(S.lastRead)); }
  const note = $("filterNote");
  if (S.person || S.search) { note.classList.add("show"); note.innerHTML = `Showing ${S.person ? "messages to and from <b>" + esc(nameOf(S.person)) + "</b>" : ""}${S.person && S.search ? " matching " : S.search ? "messages matching " : ""}${S.search ? "“" + esc(S.search) + "”" : ""} · <button class="link" id="clearFilter">Clear</button>`; $("clearFilter").onclick = () => { S.person = null; S.search = ""; $("search").value = ""; renderAll(true); }; }
  else note.classList.remove("show");
}

function renderPeople() {
  const people = [...S.agents].sort((a, b) => {
    const ta = a.last ? a.last.id : "", tb = b.last ? b.last.id : "";
    return ta === tb ? a.name.localeCompare(b.name) : ta < tb ? 1 : -1;
  });
  $("onlineCount").textContent = `${S.agents.filter(a => a.online || a.running).length}/${S.agents.length} online`;
  $("people").innerHTML = people.map(a => {
    const working = a.running || (a.activity && a.activity.state === "working");
    const failed = !working && a.activity && a.activity.state === "offline" && a.activity.detail;
    const state = working ? "Working" + (a.activity && a.activity.detail ? " · " + a.activity.detail : "")
      : failed ? a.activity.detail + " (" + rel(a.activity.at) + ")"
      : a.online ? "Online" : a.last_seen ? "Last seen " + rel(a.last_seen) : "Not seen yet";
    return `<div class="person ${S.person === a.id ? "active" : ""}" data-person="${esc(a.id)}">${avatar(a.id)}<div class="meta">
      <div class="row1"><span class="name">${esc(a.name)}</span><span class="when">${a.last ? rel(a.last.timestamp) : ""}</span></div>
      <div class="state ${working ? "working" : failed ? "failed" : ""}">${esc(state)}${a.human ? ' <span class="badge human">person</span>' : ""}${a.project !== (S.me && S.me.project) ? ' <span class="badge">' + esc(a.project) + "</span>" : ""}</div>
      <div class="last">${a.last ? esc(a.last.text) : '<i>No messages yet</i>'}</div></div></div>`;
  }).join("") || '<div class="empty">No agents yet.</div>';
}

function needs() {
  if (!S.me) return [];
  return sortedMessages().filter(m => m.from !== S.me.id && !S.dismissed.has(m.id) &&
    ((m.tags || []).includes("needs-founder") || m.to.includes(S.me.id) || (m.meta && m.meta.decision)) && !answered(m)).reverse();
}
function jobs() {
  const roots = sortedMessages().filter(m => m.meta && m.meta.job && m.meta.job.title && (m.thread === m.id || !S.messages.has(m.reply_to) || !(S.messages.get(m.reply_to).meta || {}).job));
  return roots.map(root => {
    let status = root.meta.job.status || "todo", last = root;
    for (const x of S.messages.values()) if (x.thread === root.thread && x.id > root.id && x.meta && x.meta.job && x.meta.job.status) { if (x.id > last.id) { last = x; status = x.meta.job.status; } }
    return { root, status, last };
  }).sort((a, b) => ({ active: 0, todo: 1, done: 2 }[a.status] - { active: 0, todo: 1, done: 2 }[b.status]) || (a.last.id < b.last.id ? 1 : -1));
}
function renderSide() {
  const list = needs();
  $("needsCount").textContent = list.length || ""; $("needsCountMobile").textContent = list.length || "";
  for (const b of $("sideTabs").children) b.classList.toggle("active", b.dataset.tab === S.side);
  let html = "";
  if (S.side === "needs") {
    html = list.map(m => {
      const decision = m.meta && m.meta.decision;
      return `<div class="card"><div class="head muted">${esc(nameOf(m.from))} · ${rel(m.timestamp)}</div>
        <div class="q">${decision ? esc(decision.question) : ""}</div><div class="text">${decision ? "" : renderText(m.message.slice(0, 600))}</div>
        ${decision ? `<div class="options">${decision.options.map(o => `<button class="btn" data-answer="${esc(m.id)}" data-option="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}
        <div class="options"><button class="btn primary" data-thread="${esc(m.id)}">Reply</button><button class="btn" data-dismiss="${esc(m.id)}">Dismiss</button></div></div>`;
    }).join("") || '<div class="empty">Nothing needs you right now.<br>Agents can tag a message <b>#needs-founder</b>, message you directly, or ask you a question.</div>';
  } else if (S.side === "jobs") {
    html = jobs().map(j => `<div class="job"><span class="pill ${esc(j.status)}">${esc(j.status)}</span>
      <span class="title" data-thread="${esc(j.root.id)}" title="${esc(j.root.meta.job.title)}">${esc(j.root.meta.job.title)}</span>
      <select data-jobstatus="${esc(j.root.id)}">${["todo","active","done"].map(s => `<option ${s === j.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>`).join("")
      || '<div class="empty">No jobs yet. Use “Make job” on any message, or agents can call job_update.</div>';
  } else {
    const rules = sortedMessages().filter(m => (m.tags || []).includes("team-rule"));
    html = `<div class="add-rule"><input id="ruleInput" placeholder="Add a standing rule for every agent"><button class="btn primary" id="ruleAdd">Add</button></div>` +
      (rules.map(m => `<div class="rule">${renderText(m.message)}<div class="muted">${esc(nameOf(m.from))} · ${rel(m.timestamp)}</div></div>`).join("") || '<div class="empty">No team rules yet. Agents are told to read these each time they wake.</div>');
  }
  const panel = $("sidePanel"); const focused = document.activeElement && document.activeElement.id === "ruleInput" ? $("ruleInput").value : null;
  if (focused !== null) return; // do not wipe a rule being typed
  panel.innerHTML = html;
  const add = $("ruleAdd"); if (add) add.onclick = addRule;
  const input = $("ruleInput"); if (input) input.onkeydown = e => { if (e.key === "Enter") addRule(); };
}
async function addRule() { const text = $("ruleInput").value.trim(); if (!text) return; try { await api("/api/rule", { text }); $("ruleInput").value = ""; $("ruleInput").blur(); poll.now(); toast("Rule added"); } catch (e) { toast(e.message); } }

function renderComposer() {
  const to = $("composerTo");
  if (S.person && S.me && S.person !== S.me.id) to.innerHTML = `Direct message to <b>${esc(nameOf(S.person))}</b>`;
  else if (S.person) to.innerHTML = `To <b>${esc(S.team)}</b>, the team room everyone reads (showing your own messages)`;
  else if (S.view === "direct") {
    if (to.querySelector("select") && document.activeElement === to.querySelector("select")) return;
    to.innerHTML = `Direct message to <select id="dmTo"><option value="">choose an agent…</option>${S.agents.filter(a => S.me && a.id !== S.me.id).sort((a,b)=>a.name.localeCompare(b.name)).map(a => `<option value="${esc(a.id)}" ${S.dmTo === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select>`;
    $("dmTo").onchange = e => { S.dmTo = e.target.value; };
  } else to.innerHTML = `To <b>${esc(S.team)}</b>, the team room everyone reads`;
}
function renderAll(scroll) {
  for (const c of $("views").querySelectorAll(".chip")) c.classList.toggle("active", c.dataset.view === S.view && !S.person);
  renderPeople(); renderComposer(); renderMessages(scroll); renderSide();
}

async function send() {
  const input = $("input"); const text = input.value.trim(); if (!text) return;
  const body = { text };
  if (S.person && S.person !== S.me.id) body.to = [S.person];
  else if (S.person) body.group = S.team;
  else if (S.view === "direct") { if (!S.dmTo) { toast("Choose who to message"); return; } body.to = [S.dmTo]; }
  else body.group = S.team;
  $("sendBtn").disabled = true;
  try {
    const data = await api("/api/send", body);
    input.value = ""; autosize(input); hideSuggest();
    const woke = (data.notifications || []).filter(n => ["queued", "started"].includes(n.status)).map(n => nameOf(n.agent));
    const paused = (data.notifications || []).filter(n => n.status.startsWith("paused")).map(n => nameOf(n.agent));
    if (woke.length) toast("Woke " + woke.join(", ")); else if (paused.length) toast("Paused: " + paused.join(", "));
    poll.now();
  } catch (e) { toast(e.message); }
  $("sendBtn").disabled = false;
}

async function openThread(id) {
  S.thread = id; $("drawer").classList.add("show"); $("drawerBg").classList.add("show");
  await refreshThread(true); $("threadInput").focus();
}
async function refreshThread(scroll) {
  try {
    const data = await api("/api/thread?id=" + encodeURIComponent(S.thread));
    for (const m of data.messages) S.messages.set(m.id, norm(m));
    const box = $("threadMessages");
    box.innerHTML = data.messages.map(m => messageHtml(m, true)).join("") || '<div class="empty">Thread not found.</div>';
    if (scroll) box.parentElement.scrollTop = box.parentElement.scrollHeight;
  } catch (e) { toast(e.message); }
}
function closeThread() { S.thread = null; $("drawer").classList.remove("show"); $("drawerBg").classList.remove("show"); }
async function sendThread() {
  const input = $("threadInput"); const text = input.value.trim(); if (!text || !S.thread) return;
  const msgs = [...S.messages.values()].filter(m => m.thread === (S.messages.get(S.thread) || {}).thread).sort((a,b) => a.id < b.id ? -1 : 1);
  const target = msgs.length ? msgs[msgs.length - 1].id : S.thread;
  try { await api("/api/send", { text, reply_to: target }); input.value = ""; autosize(input); await refreshThread(true); poll.now(); } catch (e) { toast(e.message); }
}

// @mention autocomplete
let suggestIndex = 0, suggestItems = [];
function currentMention(el) {
  const upto = el.value.slice(0, el.selectionStart); const m = upto.match(/(^|\s)@([\w-]*)$/);
  return m ? { query: m[2].toLowerCase(), start: el.selectionStart - m[2].length - 1 } : null;
}
function showSuggest() {
  const el = $("input"); const m = currentMention(el); const box = $("suggest");
  if (!m) return hideSuggest();
  suggestItems = S.agents.filter(a => S.me && a.id !== S.me.id && (a.name.toLowerCase().includes(m.query) || a.id.includes(m.query))).sort((a,b)=>a.name.localeCompare(b.name)).slice(0, 8);
  if (!suggestItems.length) return hideSuggest();
  suggestIndex = Math.min(suggestIndex, suggestItems.length - 1);
  box.innerHTML = suggestItems.map((a, i) => `<div class="${i === suggestIndex ? "sel" : ""}" data-pick="${i}">${avatar(a.id)}<span>${esc(a.name)}</span></div>`).join("");
  box.classList.add("show");
}
function hideSuggest() { $("suggest").classList.remove("show"); suggestItems = []; suggestIndex = 0; }
function pickSuggest(i) {
  const el = $("input"); const m = currentMention(el); const a = suggestItems[i]; if (!m || !a) return;
  el.value = el.value.slice(0, m.start) + "@" + a.name + " " + el.value.slice(el.selectionStart);
  const pos = m.start + a.name.length + 2; el.setSelectionRange(pos, pos); hideSuggest(); el.focus();
}
function autosize(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 180) + "px"; }

function notifyNeeds() {
  const ids = new Set(needs().map(m => m.id));
  if (S.knownNeeds) {
    const fresh = [...ids].filter(id => !S.knownNeeds.has(id));
    if (fresh.length && "Notification" in window && Notification.permission === "granted" && !document.hasFocus()) {
      const m = S.messages.get(fresh[0]);
      new Notification(`${nameOf(m.from)} needs you`, { body: (m.meta && m.meta.decision ? m.meta.decision.question : m.message).slice(0, 140), tag: "zboard-" + m.id });
    }
  }
  S.knownNeeds = ids;
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-thread],[data-person],[data-answer],[data-dismiss],[data-continue],[data-makejob],[data-pick],[data-view],[data-tab],[data-pane]");
  if (!t) return;
  try {
    if (t.dataset.pick !== undefined) return pickSuggest(+t.dataset.pick);
    if (t.dataset.thread) return openThread(t.dataset.thread);
    if (t.dataset.person) { S.person = S.person === t.dataset.person ? null : t.dataset.person; setPane("chat"); return renderAll(true); }
    if (t.dataset.view) { S.view = t.dataset.view; S.person = null; localStorageSet("view", S.view); return renderAll(true); }
    if (t.dataset.tab) { S.side = t.dataset.tab; return renderSide(); }
    if (t.dataset.pane) return setPane(t.dataset.pane);
    if (t.dataset.answer) { await api("/api/answer", { id: t.dataset.answer, answer: t.dataset.option }); toast("Answer sent"); return poll.now(); }
    if (t.dataset.dismiss) { await api("/api/dismiss", { id: t.dataset.dismiss }); S.dismissed.add(t.dataset.dismiss); renderSide(); return; }
    if (t.dataset.continue) { await api("/api/continue", { id: t.dataset.continue }); toast("Agents can continue"); return poll.now(); }
    if (t.dataset.makejob) { await api("/api/job", { id: t.dataset.makejob, status: "todo" }); toast("Job created"); S.side = "jobs"; return poll.now(); }
  } catch (err) { toast(err.message); }
});
document.addEventListener("change", async (e) => {
  const id = e.target.dataset && e.target.dataset.jobstatus;
  if (id) { try { await api("/api/job", { id, status: e.target.value }); poll.now(); } catch (err) { toast(err.message); } }
});
function setPane(p) { $("app").dataset.pane = p; for (const b of $("mobileNav").children) b.classList.toggle("active", b.dataset.pane === p); }
$("input").addEventListener("input", (e) => { autosize(e.target); showSuggest(); });
$("input").addEventListener("keydown", (e) => {
  if ($("suggest").classList.contains("show")) {
    if (e.key === "ArrowDown") { suggestIndex = (suggestIndex + 1) % suggestItems.length; showSuggest(); return e.preventDefault(); }
    if (e.key === "ArrowUp") { suggestIndex = (suggestIndex - 1 + suggestItems.length) % suggestItems.length; showSuggest(); return e.preventDefault(); }
    if (e.key === "Enter" || e.key === "Tab") { pickSuggest(suggestIndex); return e.preventDefault(); }
    if (e.key === "Escape") return hideSuggest();
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("threadInput").addEventListener("input", (e) => autosize(e.target));
$("threadInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendThread(); } });
$("sendBtn").onclick = send; $("threadSend").onclick = sendThread;
$("closeDrawer").onclick = closeThread; $("drawerBg").onclick = closeThread;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.thread) closeThread(); });
$("search").addEventListener("input", (e) => { S.search = e.target.value.trim().toLowerCase(); renderMessages(true); });
$("themeBtn").onclick = () => {
  const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; localStorageSet("theme", root.dataset.theme);
};
$("notifyBtn").onclick = async () => {
  if (!("Notification" in window)) return toast("This browser has no desktop notifications");
  const p = await Notification.requestPermission(); toast(p === "granted" ? "You'll get a notification when something needs you" : "Notifications are off");
};
const savedTheme = localStorageGet("theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
// Refresh straight after an action instead of waiting for the next poll.
poll.now = (() => { let busy = false; return async () => { if (busy) return; busy = true; try {
  const data = await api("/api/state?cursor=" + S.cursor);
  S.agents = data.agents; S.dismissed = new Set(data.dismissed);
  for (const m of data.messages) S.messages.set(m.id, norm(m)); S.cursor = data.cursor;
  renderAll(false); if (S.thread) refreshThread();
} catch (e) {} busy = false; }; })();
renderAll(true);
poll();
</script>
</body>
</html>
